name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_FLOOR: "100.0"

jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with coverage gate)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v c="$total" -v m="$COVERAGE_FLOOR" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "Coverage ${total}% below floor ${COVERAGE_FLOOR}%"; exit 1; }

  # Sixteen integration tests drive the real ioctls against a live btrfs mount
  # -- subvolume lifecycle, send, receive, and the filesystem admin calls --
  # and cross-check the result against btrfs-progs. Not one has ever run.
  #
  # ⛔ Installing btrfs-progs alone would NOT have been the fix. Every one of
  # them checks its MOUNT before it looks for the tool:
  #
  #   "%s is not a mounted btrfs filesystem; skipping"
  #   "BTRFS_SEND_SRC and BTRFS_SEND_DST not both set; skipping"
  #   "btrfs(8) not on PATH; skipping send interop test"
  #
  # The first two fire first, so a scan that only asks "is the binary
  # installed" is satisfied by a change that moves the silence one line up.
  # What these tests need is two btrfs filesystems and root, and a hosted
  # runner can make both: btrfs is in Ubuntu's own kernel, and a loop-mounted
  # image is a real filesystem.
  kernel:
    name: the two mounts the tests never had
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: two real btrfs filesystems
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          # attr, for setfattr(1). ⛔ Nothing pointed at it: the tests call it
          # through exec.Command("setfattr") and not exec.LookPath, so the
          # fleet scan that finds foreign judges by their LookPath could not
          # see it. The first run of these tests is what named it -- 15 of 16
          # passed and TestIntegrationReceiveFull said
          #   setfattr: exec: "setfattr": executable file not found in $PATH
          # which is a Fatal and not a skip, so at least it was loud.
          sudo apt-get install -y -qq btrfs-progs attr
          # bt3 is for simple quotas alone: switching a filesystem between full
          # and simple accounting means disabling quotas on it, and simple mode
          # leaves the SIMPLE_QUOTA incompat flag behind.
          for n in 1 2 3; do
            truncate -s 2G "$RUNNER_TEMP/bt$n.img"
            mkfs.btrfs -q "$RUNNER_TEMP/bt$n.img"
            sudo mkdir -p "/mnt/bt$n"
            sudo mount -o loop "$RUNNER_TEMP/bt$n.img" "/mnt/bt$n"
          done
          findmnt -no FSTYPE /mnt/bt1
          findmnt -no FSTYPE /mnt/bt2
          findmnt -no FSTYPE /mnt/bt3
          # Simple quotas need Linux >= 6.7; say which kernel judged them.
          uname -r

      # ⛔ A mount command that returned 0 is not a btrfs filesystem at that
      # path. Ask the kernel what is actually there, the way the tests do.
      - name: they are really btrfs
        run: |
          set -eu
          for m in /mnt/bt1 /mnt/bt2 /mnt/bt3; do
            t=$(findmnt -no FSTYPE "$m" || true)
            test "$t" = btrfs || { echo "::error::$m is $t, not btrfs"; exit 1; }
          done
          command -v btrfs
          command -v setfattr

      - name: the integration tests, as root
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" \
            BTRFS_PATH=/mnt/bt1 BTRFS_SEND_SRC=/mnt/bt1 BTRFS_SEND_DST=/mnt/bt2 \
            BTRFS_SQUOTA_PATH=/mnt/bt3 \
            go test -count=1 -v -run TestIntegration ./... 2>&1 | tee kernel-output.txt

      # ⛔ Only the five environment skips are failures here. Two others are
      # deliberate and must stay allowed: "cannot stat the test file for its
      # inode" and "no non-inline data extent found" are the test declining a
      # case its own data did not produce, the way a reference encoder declines
      # to compress what will not shrink. A blanket --- SKIP guard would turn a
      # stated policy into a red lane.
      - name: the kernel judges must have judged
        run: |
          if grep -qE "is not a mounted btrfs filesystem|not both set|BTRFS_SQUOTA_PATH not set|btrfs\(8\) not on PATH" kernel-output.txt; then
            echo "::error::an integration test skipped for want of its environment; the mounts were not used"
            exit 1
          fi
          n=$(grep -c -- "--- PASS: TestIntegration" kernel-output.txt || true)
          echo "integration tests passed: $n"
          test "$n" -ge 12 || { echo "::error::only $n integration tests passed; 18 exist"; exit 1; }
          # The provisioner path (rescan, SubvolQgroupID, SubvolLimit, EDQUOT)
          # must have been judged in both accounting modes, by name.
          for t in TestIntegrationProvisionFullQuota TestIntegrationProvisionSimpleQuota; do
            grep -q -- "--- PASS: $t " kernel-output.txt || { echo "::error::$t did not pass"; exit 1; }
          done

  emulated:
    name: emulated (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Set up binfmt (QEMU)
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            # Skip packages that genuinely have no test files; everything else
            # MUST compile. A failed compile here is a real error and fails the
            # job — we do not swallow it (a swallowed s390x build break once let a
            # whole arch silently skip its coverage gate).
            hastests=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")
            if [ -z "$hastests" ]; then
              echo "no test files for $pkg, skipping"
              continue
            fi
            echo "Compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bin in testbins/*.test; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD":/work -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v -test.short
            echo "::endgroup::"
          done

  # The 32-bit lane. Every other lane here is 64-bit, so nothing ever compiled
  # this package's tests where `int` is 32 bits wide -- and they did not
  # compile: an untyped constant above 2^31 passed where an int (or int32) is
  # expected is a compile error there and nowhere else. A library that builds
  # for 386 but whose tests do not is a library nobody has tested on 386.
  #
  # Each arch is vetted and its test binary compiled; a failed compile fails
  # the job (it is never swallowed: a skipped binary would be a green lane that
  # tested nothing). 386 then runs natively on the x86_64 runner, and arm runs
  # under the qemu binfmt_misc handler tonistiigi/binfmt registers -- the
  # binaries are static (CGO_ENABLED=0), so no container image is involved.
  # mips and mipsle are compile-only: tonistiigi/binfmt registers no
  # qemu-mips(el), and the binary fails with "Exec format error" (measured in
  # go-fsctl/blk's CI).
  thirtytwo:
    name: 32-bit (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "386"
            run: true
          - arch: arm
            run: true
          - arch: mips
            run: false
          - arch: mipsle
            run: false
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOARM: "7"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Vet (linux/${{ matrix.arch }})
        run: go vet ./...
      - name: Compile per-package test binaries (linux/${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            hastests=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")
            if [ -z "$hastests" ]; then
              echo "no test files for $pkg, skipping"
              continue
            fi
            name=$(echo "$pkg" | tr '/' '_')
            echo "Compiling test binary for $pkg"
            go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins
      - name: Set up binfmt (QEMU)
        if: matrix.run && matrix.arch == 'arm'
        run: docker run --rm --privileged tonistiigi/binfmt --install arm
      - name: Run test binaries (linux/${{ matrix.arch }})
        if: matrix.run
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(testbins/*.test)
          test ${#bins[@]} -gt 0 || { echo "::error::no test binary was built"; exit 1; }
          for bin in "${bins[@]}"; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            file "$bin"
            "$bin" -test.short -test.count=1
            echo "::endgroup::"
          done
